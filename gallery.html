<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gallery | Viral Jain</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">Viral Jain</div>

      <button class="menu-toggle" id="menuToggle" aria-label="Open navigation">
        ☰
      </button>

      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>

    <!-- GALLERY -->
    <section class="page-section">
      <h1>Project Gallery</h1>

      <p class="gallery-subtitle">Click any image to view it in full size.</p>

      <div class="gallery">
        <img src="Image 5.png" alt="Image 5" class="gallery-img" />

        <img src="Image 6.png" alt="Image 6" class="gallery-img" />

        <img src="Image 7.png" alt="Image 7" class="gallery-img" />

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
      <button
        class="lightbox-close"
        id="lightboxClose"
        aria-label="Close image"
      >
        ×
      </button>

      <img id="lightboxImage" src="" alt="Full size image" />
    </div>

    <footer>
      <p>Viral Jain</p>
    </footer>

    <script src="script.js"></script>
